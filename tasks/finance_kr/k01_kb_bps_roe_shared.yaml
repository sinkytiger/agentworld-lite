id: k01_kb_bps_roe_shared
name: BPS and trailing ROE of KB금융 at the end of 2026 H1
name_ko: KB금융 BPS·TTM ROE (2026년 상반기 말)
description_ko: KB금융(105560)의 2026년 상반기 말(2026-06-30) 기준 주당순자산(BPS)과 TTM ROE를 2026-10-15까지 접수된 보고서만으로 구합니다. collector가 공시를
  모으고 analyst가 계산하며 reporter가 제출합니다.
category: finance
domain: finance
world_guide: false
description: The desk needs the book value per share (BPS) and the trailing twelve-month (TTM) return on equity of KB금융 (KB
  Financial Group, stock code 105560) at the end of 2026 H1 (2026-06-30), using only reports filed by 2026-10-15. The collector
  pulls filings, the analyst computes, the reporter submits.
objectives:
  primary: 'Submit three answers: ttm_net_income_owners (TTM net income attributable to owners of the parent, in KRW), bps
    (common equity per common share outstanding at 2026-06-30, in KRW) and ttm_roe (ttm_net_income_owners divided by average
    common equity, in percent, e.g. 9.5 for 9.5%).'
  secondary:
  - Use as few rounds as possible.
max_rounds: 18
inputs:
  as_of: '2026-10-15'
  company: KB금융
data:
  dir: data/finance/dart_fhc
matched:
  pair_id: k01
  placement: shared
  fact_counts:
    analyst: 6
relevant_game_context: '- Common traps: consolidated (CFS) vs separate (OFS) statements, net income vs net income attributable
  to owners, equity attributable to owners vs common equity (hybrid capital securities, 신종자본증권, sit in owners'' equity), cumulative
  vs single-quarter figures, issued vs treasury shares, and reports filed after the as-of date (for an amended report DART
  serves the amended version, with its later filing date).

  - TTM = latest fiscal-year (FY) figure - prior-year cumulative figure for the same period as the latest report + latest
  cumulative figure. For an H1 report: FY(2025) - H1(2025) + H1(2026).

  - Net income means net_income_owners (attributable to owners of the parent) from consolidated (CFS) statements.

  - Common equity = equity_owners - hybrid_capital (hybrid capital securities, 신종자본증권, are part of owners'' equity but not
  common shareholders'' equity), from the CFS balance sheet.

  - BPS = common equity at 2026-06-30 / common shares outstanding, where shares outstanding = issued common shares - treasury
  common shares from the 2026 H1 report (KB금융 has no preferred shares).

  - TTM ROE (%) = TTM net income / average common equity x 100, where average common equity = (common equity at 2025-06-30
  + common equity at 2026-06-30) / 2. Do not annualize half-year or quarterly figures.

  - The latest report filed by 2026-10-15 is the 2026 H1 report, so the inputs are the 2025 FY, 2025 H1 and 2026 H1 CFS reports
  and the 2026 H1 share counts.'
agents:
- username: collector
  role: data collector
  restricted_tools:
  - calculate
  - submit_answer
- username: analyst
  role: analyst
  restricted_tools:
  - fetch_financials
  - fetch_shares
  - submit_answer
- username: reporter
  role: reporter
  restricted_tools:
  - fetch_financials
  - fetch_shares
  - calculate
verifier:
  checkpoints:
  - type: answer
    name: ttm_net_income_owners
    field: ttm_net_income_owners
    expected: 6282059000000
    rel_tol: 0.001
  - type: answer
    name: bps
    field: bps
    expected: 160402.050061
    rel_tol: 0.001
  - type: answer
    name: ttm_roe
    field: ttm_roe
    expected: 11.36088
    rel_tol: 0.001
reference_solution:
  collector:
  - - fetch_financials
    - company: '105560'
      year: 2025
      period: FY
      basis: CFS
  - - fetch_financials
    - company: '105560'
      year: 2025
      period: H1
      basis: CFS
  - - fetch_financials
    - company: '105560'
      year: 2026
      period: H1
      basis: CFS
  - - fetch_shares
    - company: '105560'
      year: 2026
      period: H1
  - - share_facts
    - to_agent: analyst
      fact_ids:
      - 105560.2025FY.CFS.net_income_owners
      - 105560.2025H1.CFS.net_income_owners
      - 105560.2026H1.CFS.net_income_owners
      - 105560.2025H1.CFS.equity_owners
      - 105560.2025H1.CFS.hybrid_capital
      - 105560.2026H1.CFS.equity_owners
      - 105560.2026H1.CFS.hybrid_capital
      - 105560.2026H1.shares_common
      - 105560.2026H1.shares_treasury_common
  analyst:
  - - wait
    - reason: waiting for inputs
    - until_have:
        105560.2026H1.shares_treasury_common: 1
      retries: 30
  - - calculate
    - name: ttm_net_income_owners
      formula: fy - h1_prev + h1
      unit: KRW
      inputs:
      - var: fy
        fact_id: 105560.2025FY.CFS.net_income_owners
      - var: h1_prev
        fact_id: 105560.2025H1.CFS.net_income_owners
      - var: h1
        fact_id: 105560.2026H1.CFS.net_income_owners
  - - calculate
    - name: common_equity
      formula: e - h
      unit: KRW
      inputs:
      - var: e
        fact_id: 105560.2026H1.CFS.equity_owners
      - var: h
        fact_id: 105560.2026H1.CFS.hybrid_capital
  - - calculate
    - name: common_equity_prev
      formula: e - h
      unit: KRW
      inputs:
      - var: e
        fact_id: 105560.2025H1.CFS.equity_owners
      - var: h
        fact_id: 105560.2025H1.CFS.hybrid_capital
  - - calculate
    - name: bps
      formula: c / (s - t)
      unit: KRW
      inputs:
      - var: c
        fact_id: calc.common_equity
      - var: s
        fact_id: 105560.2026H1.shares_common
      - var: t
        fact_id: 105560.2026H1.shares_treasury_common
  - - calculate
    - name: ttm_roe
      formula: n / ((c0 + c1) / 2) * 100
      unit: '%'
      inputs:
      - var: n
        fact_id: calc.ttm_net_income_owners
      - var: c0
        fact_id: calc.common_equity_prev
      - var: c1
        fact_id: calc.common_equity
  - - share_facts
    - to_agent: reporter
      fact_ids:
      - calc.ttm_net_income_owners
      - calc.bps
      - calc.ttm_roe
  reporter:
  - - wait
    - reason: waiting for results
    - until_have:
        calc.bps: 1
        calc.ttm_roe: 1
        calc.ttm_net_income_owners: 1
      retries: 30
  - - submit_answer
    - answers:
      - field: ttm_net_income_owners
        fact_id: calc.ttm_net_income_owners
      - field: bps
        fact_id: calc.bps
      - field: ttm_roe
        fact_id: calc.ttm_roe
