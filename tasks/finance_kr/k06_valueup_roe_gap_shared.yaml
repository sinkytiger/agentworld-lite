id: k06_valueup_roe_gap_shared
name: 'Value-up check: ROE of 신한지주 and 하나금융지주 against their stated targets'
name_ko: '밸류업 점검: 신한지주·하나금융지주 ROE와 목표까지 남은 격차'
description_ko: 신한지주(055550)와 하나금융지주(086790)의 2026년 상반기 말 TTM ROE를 구하고, 각 그룹이 기업가치 제고 계획에서 밝힌 ROE 목표까지 남은 격차를 2026-10-15까지
  접수된 보고서만으로 계산합니다. 목표는 계획 공시의 접수번호가 붙은 사실로 analyst에게 주어집니다.
category: finance
domain: finance
world_guide: false
description: 'The desk checks two groups'' return on equity against the targets in their value-up plans (기업가치 제고 계획): 신한지주
  (055550) and 하나금융지주 (086790), at the end of 2026 H1, using only reports filed by 2026-10-15. The analyst holds both targets,
  quoted from the plans. The collector pulls filings, the analyst computes, the reporter submits.'
objectives:
  primary: 'Submit four answers: shinhan_ttm_roe and hana_ttm_roe (TTM return on equity at 2026-06-30, in percent, e.g. 9.5
    for 9.5%), and shinhan_roe_gap_pp and hana_roe_gap_pp (the group''s ROE target minus its TTM ROE, in percentage points;
    positive when the group is short of its target).'
  secondary:
  - Use as few rounds as possible.
max_rounds: 20
inputs:
  as_of: '2026-10-15'
  company: 신한지주; 하나금융지주
data:
  dir: data/finance/dart_fhc
matched:
  pair_id: k06
  placement: shared
  fact_counts:
    analyst: 4
relevant_game_context: '- Common traps: consolidated (CFS) vs separate (OFS) statements, net income vs net income attributable
  to owners, equity attributable to owners vs common equity (hybrid capital securities, 신종자본증권, sit in owners'' equity), cumulative
  vs single-quarter figures, issued vs treasury shares, and reports filed after the as-of date (for an amended report DART
  serves the amended version, with its later filing date).

  - TTM = FY(2025) - H1(2025) + H1(2026), cumulative figures from consolidated (CFS) statements.

  - ROE (%) = TTM net_income_owners / average equity_owners x 100, where the average is taken over the start and the end of
  the twelve months: (equity_owners at 2025-06-30 + equity_owners at 2026-06-30) / 2. Use owners'' equity as reported (hybrid
  capital securities included); do not annualize half-year figures.

  - Gap (pp) = ROE target - TTM ROE, using the targets you hold from each group''s value-up plan.

  - The inputs are each group''s 2025 FY, 2025 H1 and 2026 H1 CFS reports.'
agents:
- username: collector
  role: data collector
  restricted_tools:
  - calculate
  - submit_answer
- username: analyst
  role: analyst
  restricted_tools:
  - fetch_financials
  - fetch_shares
  - submit_answer
  initial_facts:
  - id: 055550.valueup.roe_target
    label: 신한지주 기업가치 제고 계획 ROE 목표
    value: 10.0
    unit: '%'
    source: DART 기업가치 제고 계획
    rcept_no: '20260423800235'
    company: '055550'
  - id: 086790.valueup.roe_target
    label: 하나금융지주 기업가치 제고 계획 ROE 목표
    value: 12.0
    unit: '%'
    source: DART 기업가치 제고 계획
    rcept_no: '20260724800373'
    company: 086790
- username: reporter
  role: reporter
  restricted_tools:
  - fetch_financials
  - fetch_shares
  - calculate
verifier:
  checkpoints:
  - type: answer
    name: shinhan_ttm_roe
    field: shinhan_ttm_roe
    expected: 9.168491
    rel_tol: 0.001
  - type: answer
    name: hana_ttm_roe
    field: hana_ttm_roe
    expected: 9.114388
    rel_tol: 0.001
  - type: answer
    name: shinhan_roe_gap_pp
    field: shinhan_roe_gap_pp
    expected: 0.831509
    rel_tol: 0.001
  - type: answer
    name: hana_roe_gap_pp
    field: hana_roe_gap_pp
    expected: 2.885612
    rel_tol: 0.001
reference_solution:
  collector:
  - - fetch_financials
    - company: '055550'
      year: 2025
      period: FY
      basis: CFS
  - - fetch_financials
    - company: '055550'
      year: 2025
      period: H1
      basis: CFS
  - - fetch_financials
    - company: '055550'
      year: 2026
      period: H1
      basis: CFS
  - - fetch_financials
    - company: 086790
      year: 2025
      period: FY
      basis: CFS
  - - fetch_financials
    - company: 086790
      year: 2025
      period: H1
      basis: CFS
  - - fetch_financials
    - company: 086790
      year: 2026
      period: H1
      basis: CFS
  - - share_facts
    - to_agent: analyst
      fact_ids:
      - 055550.2025FY.CFS.net_income_owners
      - 055550.2025H1.CFS.net_income_owners
      - 055550.2026H1.CFS.net_income_owners
      - 055550.2025H1.CFS.equity_owners
      - 055550.2026H1.CFS.equity_owners
      - 086790.2025FY.CFS.net_income_owners
      - 086790.2025H1.CFS.net_income_owners
      - 086790.2026H1.CFS.net_income_owners
      - 086790.2025H1.CFS.equity_owners
      - 086790.2026H1.CFS.equity_owners
  analyst:
  - - wait
    - reason: waiting for inputs
    - until_have:
        086790.2026H1.CFS.equity_owners: 1
      retries: 30
  - - calculate
    - name: shinhan_ttm_roe
      formula: (fy - h1p + h1) / ((e0 + e1) / 2) * 100
      unit: '%'
      inputs:
      - var: fy
        fact_id: 055550.2025FY.CFS.net_income_owners
      - var: h1p
        fact_id: 055550.2025H1.CFS.net_income_owners
      - var: h1
        fact_id: 055550.2026H1.CFS.net_income_owners
      - var: e0
        fact_id: 055550.2025H1.CFS.equity_owners
      - var: e1
        fact_id: 055550.2026H1.CFS.equity_owners
  - - calculate
    - name: hana_ttm_roe
      formula: (fy - h1p + h1) / ((e0 + e1) / 2) * 100
      unit: '%'
      inputs:
      - var: fy
        fact_id: 086790.2025FY.CFS.net_income_owners
      - var: h1p
        fact_id: 086790.2025H1.CFS.net_income_owners
      - var: h1
        fact_id: 086790.2026H1.CFS.net_income_owners
      - var: e0
        fact_id: 086790.2025H1.CFS.equity_owners
      - var: e1
        fact_id: 086790.2026H1.CFS.equity_owners
  - - calculate
    - name: shinhan_roe_gap_pp
      formula: t - r
      unit: pp
      inputs:
      - var: t
        fact_id: 055550.valueup.roe_target
      - var: r
        fact_id: calc.shinhan_ttm_roe
  - - calculate
    - name: hana_roe_gap_pp
      formula: t - r
      unit: pp
      inputs:
      - var: t
        fact_id: 086790.valueup.roe_target
      - var: r
        fact_id: calc.hana_ttm_roe
  - - share_facts
    - to_agent: reporter
      fact_ids:
      - calc.shinhan_ttm_roe
      - calc.hana_ttm_roe
      - calc.shinhan_roe_gap_pp
      - calc.hana_roe_gap_pp
  reporter:
  - - wait
    - reason: waiting for results
    - until_have:
        calc.shinhan_ttm_roe: 1
        calc.hana_ttm_roe: 1
        calc.shinhan_roe_gap_pp: 1
        calc.hana_roe_gap_pp: 1
      retries: 30
  - - submit_answer
    - answers:
      - field: shinhan_ttm_roe
        fact_id: calc.shinhan_ttm_roe
      - field: hana_ttm_roe
        fact_id: calc.hana_ttm_roe
      - field: shinhan_roe_gap_pp
        fact_id: calc.shinhan_roe_gap_pp
      - field: hana_roe_gap_pp
        fact_id: calc.hana_roe_gap_pp
