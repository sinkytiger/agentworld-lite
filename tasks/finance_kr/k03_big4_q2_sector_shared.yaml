id: k03_big4_q2_sector_shared
name: 'Korea''s four financial holding companies: Q2 2026 earnings and common equity'
name_ko: 4대 금융지주 2026년 2분기 지배주주순이익과 보통주자본
description_ko: KB금융(105560), 신한지주(055550), 하나금융지주(086790), 우리금융지주(316140)의 2026년 2분기(4~6월) 단독 지배주주순이익과 2분기 말 보통주자본을 2026-10-15까지
  접수된 보고서만으로 비교합니다. collector가 공시를 모으고 analyst가 계산하며 reporter가 제출합니다.
category: finance
domain: finance
world_guide: false
description: The desk compares Korea's four largest financial holding companies, KB금융 (105560), 신한지주 (055550), 하나금융지주 (086790)
  and 우리금융지주 (316140), on earnings for the second quarter of 2026 alone (April-June 2026) and on common equity at the end
  of that quarter, using only reports filed by 2026-10-15. The collector pulls filings, the analyst computes, the reporter
  submits.
objectives:
  primary: 'Submit six answers: kb_q2_net_income_owners, shinhan_q2_net_income_owners, hana_q2_net_income_owners and woori_q2_net_income_owners
    (each group''s net income attributable to owners of the parent for that single quarter, in KRW); common_equity_average
    (the simple average of the four groups'' common equity at 2026-06-30, in KRW); and common_equity_spread (the largest of
    those four common equity figures minus the smallest, in KRW).'
  secondary:
  - Use as few rounds as possible.
max_rounds: 30
inputs:
  as_of: '2026-10-15'
  company: KB금융; 신한지주; 하나금융지주; 우리금융지주
data:
  dir: data/finance/dart_fhc
matched:
  pair_id: k03
  placement: shared
  fact_counts:
    analyst: 4
relevant_game_context: '- Common traps: consolidated (CFS) vs separate (OFS) statements, net income vs net income attributable
  to owners, equity attributable to owners vs common equity (hybrid capital securities, 신종자본증권, sit in owners'' equity), cumulative
  vs single-quarter figures, issued vs treasury shares, and reports filed after the as-of date (for an amended report DART
  serves the amended version, with its later filing date).

  - Report figures are cumulative from January, so a standalone Q2 figure = H1 cumulative - Q1 cumulative.

  - Net income means net_income_owners (attributable to owners of the parent) from consolidated (CFS) statements, for every
  group, so the four figures are comparable; do not mix in net_income, which includes non-controlling interests.

  - Common equity = equity_owners - hybrid_capital (hybrid capital securities, 신종자본증권, are part of owners'' equity but not
  common equity), from each group''s 2026 H1 CFS balance sheet. Balance-sheet items are period-end balances and need no single-quarter
  adjustment.

  - The inputs are each group''s 2026 Q1 CFS and 2026 H1 CFS reports.'
agents:
- username: collector
  role: data collector
  restricted_tools:
  - calculate
  - submit_answer
- username: analyst
  role: analyst
  restricted_tools:
  - fetch_financials
  - fetch_shares
  - submit_answer
- username: reporter
  role: reporter
  restricted_tools:
  - fetch_financials
  - fetch_shares
  - calculate
verifier:
  checkpoints:
  - type: answer
    name: kb_q2_net_income_owners
    field: kb_q2_net_income_owners
    expected: 1992189000000
    rel_tol: 0.001
  - type: answer
    name: shinhan_q2_net_income_owners
    field: shinhan_q2_net_income_owners
    expected: 1820135000000
    rel_tol: 0.001
  - type: answer
    name: hana_q2_net_income_owners
    field: hana_q2_net_income_owners
    expected: 1192823000000
    rel_tol: 0.001
  - type: answer
    name: woori_q2_net_income_owners
    field: woori_q2_net_income_owners
    expected: 1004578000000
    rel_tol: 0.001
  - type: answer
    name: common_equity_average
    field: common_equity_average
    expected: 47617977250000.0
    rel_tol: 0.001
  - type: answer
    name: common_equity_spread
    field: common_equity_spread
    expected: 21310474000000
    rel_tol: 0.001
reference_solution:
  collector:
  - - fetch_financials
    - company: '105560'
      year: 2026
      period: Q1
      basis: CFS
  - - fetch_financials
    - company: '105560'
      year: 2026
      period: H1
      basis: CFS
  - - fetch_financials
    - company: '055550'
      year: 2026
      period: Q1
      basis: CFS
  - - fetch_financials
    - company: '055550'
      year: 2026
      period: H1
      basis: CFS
  - - fetch_financials
    - company: 086790
      year: 2026
      period: Q1
      basis: CFS
  - - fetch_financials
    - company: 086790
      year: 2026
      period: H1
      basis: CFS
  - - fetch_financials
    - company: '316140'
      year: 2026
      period: Q1
      basis: CFS
  - - fetch_financials
    - company: '316140'
      year: 2026
      period: H1
      basis: CFS
  - - share_facts
    - to_agent: analyst
      fact_ids:
      - 105560.2026Q1.CFS.net_income_owners
      - 105560.2026H1.CFS.net_income_owners
      - 055550.2026Q1.CFS.net_income_owners
      - 055550.2026H1.CFS.net_income_owners
      - 086790.2026Q1.CFS.net_income_owners
      - 086790.2026H1.CFS.net_income_owners
      - 316140.2026Q1.CFS.net_income_owners
      - 316140.2026H1.CFS.net_income_owners
      - 105560.2026H1.CFS.equity_owners
      - 105560.2026H1.CFS.hybrid_capital
      - 055550.2026H1.CFS.equity_owners
      - 055550.2026H1.CFS.hybrid_capital
      - 086790.2026H1.CFS.equity_owners
      - 086790.2026H1.CFS.hybrid_capital
      - 316140.2026H1.CFS.equity_owners
      - 316140.2026H1.CFS.hybrid_capital
  analyst:
  - - wait
    - reason: waiting for inputs
    - until_have:
        316140.2026H1.CFS.hybrid_capital: 1
      retries: 30
  - - calculate
    - name: kb_q2_net_income_owners
      formula: h1 - q1
      unit: KRW
      inputs:
      - var: h1
        fact_id: 105560.2026H1.CFS.net_income_owners
      - var: q1
        fact_id: 105560.2026Q1.CFS.net_income_owners
  - - calculate
    - name: shinhan_q2_net_income_owners
      formula: h1 - q1
      unit: KRW
      inputs:
      - var: h1
        fact_id: 055550.2026H1.CFS.net_income_owners
      - var: q1
        fact_id: 055550.2026Q1.CFS.net_income_owners
  - - calculate
    - name: hana_q2_net_income_owners
      formula: h1 - q1
      unit: KRW
      inputs:
      - var: h1
        fact_id: 086790.2026H1.CFS.net_income_owners
      - var: q1
        fact_id: 086790.2026Q1.CFS.net_income_owners
  - - calculate
    - name: woori_q2_net_income_owners
      formula: h1 - q1
      unit: KRW
      inputs:
      - var: h1
        fact_id: 316140.2026H1.CFS.net_income_owners
      - var: q1
        fact_id: 316140.2026Q1.CFS.net_income_owners
  - - calculate
    - name: common_equity_average
      formula: ((kb_e - kb_h) + (shinhan_e - shinhan_h) + (hana_e - hana_h) + (woori_e - woori_h)) / 4
      unit: KRW
      inputs:
      - var: kb_e
        fact_id: 105560.2026H1.CFS.equity_owners
      - var: kb_h
        fact_id: 105560.2026H1.CFS.hybrid_capital
      - var: shinhan_e
        fact_id: 055550.2026H1.CFS.equity_owners
      - var: shinhan_h
        fact_id: 055550.2026H1.CFS.hybrid_capital
      - var: hana_e
        fact_id: 086790.2026H1.CFS.equity_owners
      - var: hana_h
        fact_id: 086790.2026H1.CFS.hybrid_capital
      - var: woori_e
        fact_id: 316140.2026H1.CFS.equity_owners
      - var: woori_h
        fact_id: 316140.2026H1.CFS.hybrid_capital
  - - calculate
    - name: common_equity_spread
      formula: (kb_e - kb_h) - (woori_e - woori_h)
      unit: KRW
      inputs:
      - var: kb_e
        fact_id: 105560.2026H1.CFS.equity_owners
      - var: kb_h
        fact_id: 105560.2026H1.CFS.hybrid_capital
      - var: woori_e
        fact_id: 316140.2026H1.CFS.equity_owners
      - var: woori_h
        fact_id: 316140.2026H1.CFS.hybrid_capital
  - - share_facts
    - to_agent: reporter
      fact_ids:
      - calc.kb_q2_net_income_owners
      - calc.shinhan_q2_net_income_owners
      - calc.hana_q2_net_income_owners
      - calc.woori_q2_net_income_owners
      - calc.common_equity_average
      - calc.common_equity_spread
  reporter:
  - - wait
    - reason: waiting for results
    - until_have:
        calc.common_equity_spread: 1
        calc.common_equity_average: 1
        calc.kb_q2_net_income_owners: 1
        calc.shinhan_q2_net_income_owners: 1
        calc.hana_q2_net_income_owners: 1
        calc.woori_q2_net_income_owners: 1
      retries: 30
  - - submit_answer
    - answers:
      - field: kb_q2_net_income_owners
        fact_id: calc.kb_q2_net_income_owners
      - field: shinhan_q2_net_income_owners
        fact_id: calc.shinhan_q2_net_income_owners
      - field: hana_q2_net_income_owners
        fact_id: calc.hana_q2_net_income_owners
      - field: woori_q2_net_income_owners
        fact_id: calc.woori_q2_net_income_owners
      - field: common_equity_average
        fact_id: calc.common_equity_average
      - field: common_equity_spread
        fact_id: calc.common_equity_spread
