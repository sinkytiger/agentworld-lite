id: c01_ry_ttm_pe_private
name: Trailing P/E of Royal Bank of Canada
category: finance
domain: finance
world_guide: false
description: 'The desk needs the trailing twelve-month (TTM) P/E of Royal Bank of Canada (TSX: RY) at the end of its fiscal
  2026 third quarter (July 31, 2026), using only filings made by 2026-09-30. The collector pulls filings, the analyst computes,
  the reporter submits.'
objectives:
  primary: 'Submit two answers: ttm_net_income_common (TTM net income available to common shareholders, in CAD) and pe (the
    closing share price on 2026-07-31 divided by TTM diluted EPS, as a multiple such as 12.3).'
  secondary:
  - Use as few rounds as possible.
max_rounds: 16
inputs:
  as_of: '2026-09-30'
  company: Royal Bank of Canada
data:
  dir: data/finance/edgar
matched:
  pair_id: c01
  placement: private
  fact_counts:
    analyst: 4
    reporter: 1
relevant_game_context: '- Common traps: fiscal vs calendar periods (the banks'' fiscal year ends October 31), year-to-date
  vs single-quarter figures, net income attributable to shareholders vs net income available to common shareholders, basic
  vs diluted EPS, ratios as fractions vs percent, and filings made after the as-of date.'
agents:
- username: collector
  role: data collector
  restricted_tools:
  - calculate
  - submit_answer
- username: analyst
  role: analyst
  restricted_tools:
  - fetch_financials
  - submit_answer
  role_brief: 'TTM = latest fiscal-year (FY) figure - prior-year year-to-date figure for the same period as the latest report
    + latest year-to-date figure. For a fiscal Q3 report: FY(fiscal 2025) - Q3(fiscal 2025) + Q3(fiscal 2026). Net income
    means net_income_common (available to common shareholders, after preferred dividends and distributions on other equity
    instruments) from consolidated (CFS) statements. P/E = closing share price / TTM diluted EPS, where TTM diluted EPS applies
    the same TTM formula to eps_diluted. RBC''s fiscal year ends October 31. The latest filing made by 2026-09-30 is the fiscal
    2026 Q3 report (period ended July 31, 2026), so the inputs are the fiscal 2025 FY, fiscal 2025 Q3 and fiscal 2026 Q3 CFS
    reports.'
- username: reporter
  role: reporter
  restricted_tools:
  - fetch_financials
  - calculate
  initial_facts:
  - price_of: RY
    date: '2026-07-31'
  role_brief: The reporter holds RBC's TSX closing price of 2026-07-31 from the market-data desk.
verifier:
  checkpoints:
  - type: answer
    name: ttm_net_income_common
    field: ttm_net_income_common
    expected: 22187000000
    rel_tol: 0.001
  - type: answer
    name: pe
    field: pe
    expected: 18.5
    rel_tol: 0.001
reference_solution:
  collector:
  - - fetch_financials
    - company: RY
      year: 2025
      period: FY
      basis: CFS
  - - fetch_financials
    - company: RY
      year: 2025
      period: Q3
      basis: CFS
  - - fetch_financials
    - company: RY
      year: 2026
      period: Q3
      basis: CFS
  - - share_facts
    - to_agent: analyst
      fact_ids:
      - RY.2025FY.CFS.net_income_common
      - RY.2025Q3.CFS.net_income_common
      - RY.2026Q3.CFS.net_income_common
      - RY.2025FY.CFS.eps_diluted
      - RY.2025Q3.CFS.eps_diluted
      - RY.2026Q3.CFS.eps_diluted
  analyst:
  - - wait
    - reason: waiting for inputs
    - until_have:
        RY.2026Q3.CFS.eps_diluted: 1
        RY.price.2026-07-31: 1
      retries: 30
  - - calculate
    - name: ttm_net_income_common
      formula: fy - ytd_prev + ytd
      unit: CAD
      inputs:
      - var: fy
        fact_id: RY.2025FY.CFS.net_income_common
      - var: ytd_prev
        fact_id: RY.2025Q3.CFS.net_income_common
      - var: ytd
        fact_id: RY.2026Q3.CFS.net_income_common
  - - calculate
    - name: ttm_eps_diluted
      formula: fy - ytd_prev + ytd
      unit: CAD/share
      inputs:
      - var: fy
        fact_id: RY.2025FY.CFS.eps_diluted
      - var: ytd_prev
        fact_id: RY.2025Q3.CFS.eps_diluted
      - var: ytd
        fact_id: RY.2026Q3.CFS.eps_diluted
  - - calculate
    - name: pe
      formula: p / e
      unit: x
      inputs:
      - var: p
        fact_id: RY.price.2026-07-31
      - var: e
        fact_id: calc.ttm_eps_diluted
  - - share_facts
    - to_agent: reporter
      fact_ids:
      - calc.ttm_net_income_common
      - calc.pe
  reporter:
  - - share_facts
    - to_agent: analyst
      fact_ids:
      - RY.price.2026-07-31
  - - wait
    - reason: waiting for results
    - until_have:
        calc.pe: 1
        calc.ttm_net_income_common: 1
      retries: 30
  - - submit_answer
    - answers:
      - field: ttm_net_income_common
        fact_id: calc.ttm_net_income_common
      - field: pe
        fact_id: calc.pe
